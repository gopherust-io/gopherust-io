<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="gopherust.io ecosystem">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f9fa"/>
      <stop offset="100%" stop-color="#eef4f6"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" rx="8" fill="url(#bg)"/>
  <text x="48" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="700" fill="#0f172a">Ecosystem</text>
  <text x="48" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#64748b">one toolkit · five focused libraries</text>

  <!-- links from hub -->
  <g fill="none" stroke="#0d9488" stroke-opacity="0.4" stroke-width="2">
    <path d="M600 150 L320 110"/>
    <path d="M600 150 L320 190"/>
    <path d="M600 150 L880 110"/>
    <path d="M600 150 L880 190"/>
  </g>

  <!-- hub: nats-console -->
  <rect x="490" y="122" width="220" height="56" rx="8" fill="url(#hub)"/>
  <text x="600" y="146" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="700" fill="#ffffff">nats-console</text>
  <text x="600" y="166" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#ccfbf1">JetStream admin UI</text>

  <!-- satellites -->
  <rect x="200" y="88" width="140" height="44" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="270" y="115" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="600" fill="#0f172a">nats</text>

  <rect x="200" y="168" width="140" height="44" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="270" y="195" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="600" fill="#0f172a">env</text>

  <rect x="860" y="88" width="140" height="44" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="930" y="115" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="600" fill="#0f172a">tel</text>

  <rect x="860" y="168" width="140" height="44" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="930" y="195" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="600" fill="#0f172a">goalign</text>

  <text x="270" y="248" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#64748b">messaging · config</text>
  <text x="930" y="248" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#64748b">telemetry · alignment</text>
</svg>
